---
- name: ensure central inventory file exists
  ansible.builtin.copy:
    content: "{}"
    dest: "{{ ssh_key_rotation_inventory_path }}"
    force: false
    mode: "0600"

- name: load central inventory
  ansible.builtin.slurp:
    src: "{{ ssh_key_rotation_inventory_path }}"
  register: ssh_key_rotation_inventory_raw

- name: build this host's inventory record
  ansible.builtin.set_fact:
    ssh_key_rotation_record: >-
      {{ build_inventory_record(
           inventory_hostname,
           (ssh_key_rotation_new_fingerprints.results | map(attribute='stdout') | list | join(' | ')),
           ansible_date_time.iso8601,
           ssh_key_rotation_users | map(attribute='authorized_keys') | map('length') | sum
      ) }}

- name: merge record into central inventory and write back
  ansible.builtin.copy:
    content: >-
      {{
        (ssh_key_rotation_inventory_raw.content | b64decode | from_json)
        | combine({inventory_hostname: ssh_key_rotation_record})
        | to_nice_json
      }}
    dest: "{{ ssh_key_rotation_inventory_path }}"
    mode: "0600"
