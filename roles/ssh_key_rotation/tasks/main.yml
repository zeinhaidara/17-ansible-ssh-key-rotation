---
- name: Rotate ssh host keys
  include_tasks: host_keys.yml

- name: Reconcile authorized_keys from central inventory
  include_tasks: authorized_keys.yml

- name: Record rotation in central inventory
  include_tasks: inventory_update.yml

- name: Notify owners of rotation
  include_tasks: notify.yml
  when: ssh_key_rotation_notify_enabled | bool
